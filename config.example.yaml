# DogBuddyCn configuration example — copy to /etc/dogbuddy/config.yaml
# Secrets can be supplied via env instead: DOGBUDDY_LLM_API_KEY, DOGBUDDY_PANEL_TOKEN,
# DOGBUDDY_WEB_TOKEN, DOGBUDDY_GATEWAY_TOKEN (env wins over this file).

llm:
  provider: openai_compat          # openai_compat | ollama
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini
  api_key: ""                      # or DOGBUDDY_LLM_API_KEY
  keys: []                         # extra keys, config only (rate limit never switches keys)
  temperature: 0.7
  max_context_tokens: 128000
  compact_threshold: 0.8           # compact at 80% of the model window
  request_timeout: 120
  ollama_base_url: http://127.0.0.1:11434
  retry:                           # M-H rate-limit retry (free relays rate-limit a lot)
    base_interval: 10              # seconds before the 1st retry
    max_interval: 300              # backoff cap
    max_retries: 5
    backoff: exp                   # exp | fixed

gateway:
  enabled: true
  # 安全默认：只监听本机。要暴露到局域网/公网，必须同时配置 access_token 与 whitelist。
  host: 127.0.0.1
  port: 8095
  access_token: ""                 # OneBot access token (NapCat config must match)
  whitelist: []                    # QQ ids allowed; empty = deny all unless allow_all
  allow_all: false                 # 显式危险开关：空白名单也放行
  push_target: {}                  # e.g. {type: private, id: 123456789} or {type: group, id: 987654321}
  mention_only: true               # v0.10.50：群聊只在 @机器人 时响应（否则群里每句话都跑一轮）
  merge_seconds: 2.0               # v0.10.50：连发合并窗口（同一人几秒内的几句拼成一段）

web:
  host: 127.0.0.1
  port: 8100
  auth_token: ""                   # console token; or DOGBUDDY_WEB_TOKEN
  password: ""                     # optional login password

kernel:
  enabled: true                    # 持久队列/Outbox/Shadow 内核
  shadow: true                     # 只记录 Trigger，不接管执行（可回滚）
  route: "off"                     # off|shadow|explicit|auto
  route_conversations: []          # explicit/auto 生效的 Web 会话；空 = 全部

review:
  mode: "off"                      # off|shadow|enforce
  window_id: ""                    # 审查员工位；空 = 请求进入 waiting_human
  reviewer_model: ""               # 可选：审查用模型覆盖
  test_commands: []                # run_tests 白名单，如 ["pytest -q"]
  max_rework: 1                    # enforce 下最多自动返工次数

panel:                             # AegisServerPanel integration (never modified)
  enabled: true
  base_url: http://127.0.0.1:8787
  agent_token: ""                  # or DOGBUDDY_PANEL_TOKEN

paths:
  data_dir: /var/lib/dogbuddy
  workspaces_dir: /var/lib/dogbuddy/workspaces

update:                            # self-upgrade (manage.py update)
  source: git                      # git | bundle
  ref: origin/main                 # git ref to follow when source=git
  health_tries: 30                 # /healthz polls before declaring failure (×1s)

